esphome:
  name: solar-router
  friendly_name: Solar Router

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging 
logger:
  baud_rate: 115200
  level: INFO
  logs:
    component: ERROR
    light: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# WiFi connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Activate web interface
web_server:
  port: 80

# Define watchdog time (it should be greater than timeout)
http_request:
  watchdog_timeout: 12s

# ----------------------------------------------------------------------------------------------------
# Customisation
# ----------------------------------------------------------------------------------------------------  

packages:
  solar_router:
    url: https://github.com/hacf-fr/Solar-Router-for-ESPHome/
    ref: main
    refresh: 1d
    files:
      - path: solar_router/common.yaml
      - path: solar_router/power_meter_home_assistant.yaml
        vars:
          main_power_sensor: "sensor.solarnet_main_power"
          consumption_sensor: "sensor.solarnet_load_consumed"
      - path: solar_router/engine_1dimmer.yaml
        vars:
          green_led_pin: GPIO32
          green_led_inverted: 'False'
          yellow_led_pin: GPIO14
          yellow_led_inverted: 'False'
          hide_regulators: 'True'
          hide_leds: 'True'
      # Theorectical energy usage
      #- path: solar_router/energy_counter_theorical.yaml
      # JSY-MK-194T management
      - path: solar_router/jsy-mk-194t_common.yaml
        vars:          
          uart_tx_pin: GPIO26
          uart_rx_pin: GPIO27
          uart_baud_rate: 4800
          AP_Ch2_internal: "false"
      # derived energy measurement via JSY-MK-194T
      - path: solar_router/energy_counter_jsy-mk-194t.yaml
        
      - path: solar_router/scheduler_forced_run.yaml 
      #- path: solar_router/regulator_triac.yaml
      #  vars:
      #    regulator_gate_pin: GPIO22
      #    regulator_zero_crossing_pin: GPIO23
      - path: solar_router/regulator_solid_state_relay.yaml
        vars:
          regulator_gate_pin: GPIO16