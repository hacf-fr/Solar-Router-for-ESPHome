# ----------------------------------------------------------------------------------------------------
# Physical 3-position switch driving solar routing activation
# ----------------------------------------------------------------------------------------------------
# An ON-OFF-ON toggle switch, common wired to GND, drives two GPIO:
#   - "off" contact closed   -> solar routing disabled
#   - no contact closed      -> solar routing enabled (centre position)
#   - "force" contact closed -> router forced at ${activate_switch_forced_level} %
# The physical switch always wins: any other source (Home Assistant, web server, scheduler) is
# realigned on its position.
# This package is exclusive with activate_switch.yaml.

substitutions:
  # By default each contact shorts its pin to GND when the lever selects it
  activate_switch_off_inverted: "True"
  activate_switch_force_inverted: "True"
  # By default the contacts are not exposed in Home Assistant
  hide_activate_switch: "True"
  # By default the position of the physical switch is reported in Home Assistant
  hide_activate_switch_position: "False"
  # Debounce time of the mechanical contacts
  activate_switch_debounce: 50ms
  # When true, the position of the switch is continuously enforced.
  # Set it to "false" to only apply it when the switch is operated, and let Home Assistant or the
  # scheduler drive the router in between.
  activate_switch_strict: "true"
  # Router level applied in the "forced" position
  activate_switch_forced_level: "100"

binary_sensor:
  - platform: gpio
    id: activate_switch_off
    name: "Activate Switch Off Contact"
    internal: ${hide_activate_switch}
    pin:
      number: ${activate_switch_off_pin}
      mode: INPUT_PULLUP
      inverted: ${activate_switch_off_inverted}
    filters:
      - delayed_on_off: ${activate_switch_debounce}
    on_state:
      then:
        - script.execute: activate_switch_control

  - platform: gpio
    id: activate_switch_force
    name: "Activate Switch Force Contact"
    internal: ${hide_activate_switch}
    pin:
      number: ${activate_switch_force_pin}
      mode: INPUT_PULLUP
      inverted: ${activate_switch_force_inverted}
    filters:
      - delayed_on_off: ${activate_switch_debounce}
    on_state:
      then:
        - script.execute: activate_switch_control

text_sensor:
  # Position of the physical switch, as read from the two contacts
  - platform: template
    id: activate_switch_position
    name: "Activate Switch Position"
    entity_category: diagnostic
    internal: ${hide_activate_switch_position}
    update_interval: never

script:
  - id: activate_switch_control
    mode: single
    then:
      - lambda: |-
          // 0 = routing disabled, 1 = solar routing (centre position), 2 = forced run
          int position = 1;
          if (id(activate_switch_force).state) {
            position = 2;
          } else if (id(activate_switch_off).state) {
            position = 0;
          }

          // Report the position of the physical switch, only when it changes:
          // TextSensor::publish_state() does not deduplicate.
          const char *label = "Solar routing";
          if (position == 0) {
            label = "Disabled";
          } else if (position == 2) {
            label = "Forced ${activate_switch_forced_level}%";
          }
          if (id(activate_switch_position).state != label) {
            id(activate_switch_position).publish_state(label);
          }

          // Solar regulation runs in the centre position only.
          // Act only when the state actually differs: TemplateSwitch::write_state() triggers
          // on_turn_on / on_turn_off unconditionally, before publish_state().
          bool activate_target = (position == 1);
          if (id(activate).state != activate_target) {
            if (activate_target) {
              id(activate).turn_on();
            } else {
              id(activate).turn_off();
            }
          }
          if (position == 1) {
            // energy_regulation drives router_level from now on
            return;
          }

          // "activate" is off, so energy_regulation no longer enforces the temperature safety
          // limit: enforce it here, otherwise a forced run would ignore the temperature limiter.
          // Number::publish_state() does not deduplicate either, hence the comparison.
          float target = 0.0f;
          if (position == 2 && !id(safety_limit)) {
            target = ${activate_switch_forced_level};
          }
          if (id(router_level).state != target) {
            auto call = id(router_level).make_call();
            call.set_value(target);
            call.perform();
          }

interval:
  # Enforce the position of the physical switch.
  # This also covers the boot sequence, where "activate" is restored from flash before the
  # position of the physical switch is known.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return ${activate_switch_strict};
          then:
            - script.execute: activate_switch_control
