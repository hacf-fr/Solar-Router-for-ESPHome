# ----------------------------------------------------------------------------------------------------
# User interaction
# ----------------------------------------------------------------------------------------------------

globals:
  # By default, if no temperature package is used, safety_limit is disabled
  - id: safety_limit
    type: bool
    initial_value: "false"

sensor:
  - platform: copy
    source_id: real_power
    name: "Real Power Internal"
    id: real_power_internal
    internal: "True"
    on_value:
      then:
        - logger.log: "Real power updated, run energy_regulation if activated"
        - if:
            condition:
              switch.is_on: activate
            then:
              script.execute: energy_regulation

substitutions:
  # By default LEDs are pin-controlled and not inverted
  green_led_inverted: "False"
  yellow_led_inverted: "False"
  # By default regulators are hidden
  hide_regulators: "True"
  # By default LEDs are hidden
  hide_leds: "True"

# Component managing time.
# If the activate switch is ON, yellow LED update is performed every second
interval:
  - interval: 1s
    then:
      - if:
          condition:
            switch.is_on: activate
          then:
            - light.turn_off: yellow_led
            - if:
                condition:
                  lambda: return isnan(id(real_power).state);
                then:
                  # When real_power is NaN, it means an error occurred. Yellow LED blinks fast
                  - light.turn_on:
                      id: yellow_led
                      effect: fast
                else:
                  - light.turn_on: yellow_led
  # Manage WiFi feedback with yellow LED
  - interval: 5s
    then:
      - light.turn_off: yellow_led
      - if:
          condition:
            lambda: return network::is_connected();
          then:
            - light.turn_on: yellow_led
          else:
            - light.turn_on:
                id: yellow_led
                effect: blink

# ----------------------------------------------------------------------------------------------------
# LED Management
# ----------------------------------------------------------------------------------------------------
output:
  - id: yellow_led_output
    platform: gpio
    pin:
      number: ${yellow_led_pin}
      inverted: ${yellow_led_inverted}

  - id: green_led_output
    platform: gpio
    pin:
      number: ${green_led_pin}
      inverted: ${green_led_inverted}

light:
  - id: yellow_led
    name: "Yellow Led"
    platform: binary
    output: yellow_led_output
    internal: ${hide_leds}
    effects:
      - strobe:
          name: blink
          colors:
            - state: True
              brightness: 100%
              duration: 250ms
            - state: False
              brightness: 100%
              duration: 250ms
      - strobe:
          name: fast
          colors:
            - state: True
              brightness: 100%
              duration: 50ms
            - state: False
              brightness: 100%
              duration: 50ms

  - id: green_led
    name: "Green Led"
    platform: binary
    output: green_led_output
    internal: ${hide_leds}
    effects:
      - strobe:
          name: blink
          colors:
            - state: True
              brightness: 100%
              duration: 250ms
            - state: False
              brightness: 100%
              duration: 250ms

text_sensor:
  - platform: template
    id: version_engine_common
    name: "engine_common"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      // Publish once shortly after boot, then stay silent.
      static bool published = false;
      if (published) return {};
      published = true;
      return {"1.6.10"};
    disabled_by_default: false