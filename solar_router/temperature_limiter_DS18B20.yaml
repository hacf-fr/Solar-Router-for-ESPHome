substitutions:
  DS18B20_address: "0"
  temperature_update_interval: 5s
  red_led_inverted: "False"

packages: 
  temperature_limiter_common: !include temperature_limiter_common.yaml

one_wire:
  - platform: gpio
    pin: ${DS18B20_pin}
    id: dallas_d7

sensor:
  - platform: dallas_temp
    id: safety_temperature
    address: ${DS18B20_address}
    one_wire_id: dallas_d7
    name: safety_temperature
    update_interval: ${temperature_update_interval}
    on_value:
      - script.execute:
          id: safety_limit_check

text_sensor:
  - platform: template
    id: version_temperature_limiter_DS18B20
    name: "temperature_limiter_DS18B20"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      // Publish once shortly after boot, then stay silent.
      static bool published = false;
      if (published) return {};
      published = true;
      return {"1.4.1"};
    disabled_by_default: false