# ----------------------------------------------------------------------------------------------------
# Define scripts for energy divertion
# ----------------------------------------------------------------------------------------------------

script:
  # Apply regulation on relay
  - id: regulation_control
    mode: single
    then:
      # Apply opening level on relay ldec output
      - output.turn_on: ssr_output
      - output.set_level:
          id: ssr_output
          level: !lambda return id(regulator_opening).state/100.0;

# ----------------------------------------------------------------------------------------------------
# relay control
# ----------------------------------------------------------------------------------------------------

# Control the relay through GPIO
output:
  - platform: slow_pwm
    id: ssr_output
    pin: ${regulator_gate_pin}
    period: 330ms

text_sensor:
  - platform: template
    id: version_regulator_solid_state_relay
    name: "regulator_solid_state_relay"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      // Publish once shortly after boot, then stay silent.
      static bool published = false;
      if (published) return {};
      published = true;
      return {"1.5.0"};
    disabled_by_default: false