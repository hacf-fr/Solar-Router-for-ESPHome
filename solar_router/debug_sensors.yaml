# ----------------------------------------------------------------------------------------------------
# Debug sensors
# ----------------------------------------------------------------------------------------------------

debug:
  update_interval: 5s

psram:
  mode: quad
  speed: 80MHz

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  - platform: template
    id: version_debug_sensors
    name: "debug_sensors"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      // Publish once shortly after boot, then stay silent.
      static bool published = false;
      if (published) return {};
      published = true;
      return {"1.6.3"};
    disabled_by_default: false

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"
