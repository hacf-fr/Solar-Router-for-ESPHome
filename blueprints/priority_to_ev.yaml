blueprint:
  name: "Solar Router — Priority to EV"
  description: |-
    Give an EV charger priority over the Solar Router.

    When the EV is plugged in and enough solar surplus is available for
    long enough, this automation turns the Solar Router **off** so the
    surplus is released to the grid, where the EV's own smart-charging
    logic (Zappi, OpenEVSE, Wallbox Quasar…) picks it up. The router is
    turned back **on** in four situations: the EV is unplugged, the SoC
    target is reached, a passing cloud starts pulling power from the
    grid, or the EV stops taking the surplus (car full or paused).

    Handoff signal (router ON → OFF):
        surplus = max(0, −grid_power) + max(0, diverted_power)
        surplus > EV_Charging_Minimum_Surplus for surplus_duration_trigger s

    Restore signals (router OFF → ON), in addition to unplug / SoC:
      • grid_power  > cloud_import_threshold     for N s  →  cloud
      • −grid_power > release_export_threshold   for N s  →  EV done / paused

    Watching grid_power directly on the restore side is what makes this
    blueprint robust: the surplus formula collapses to ~0 once the EV is
    charging, so it cannot distinguish a cloud from ordinary EV
    consumption. Grid power can.

    Requires the router firmware modification that keeps `Real Power`
    updating while `Activate Solar Routing` is OFF (shipped with the
    same version of Solar-Router-for-ESPHome as this blueprint).

  domain: automation

  homeassistant:
    min_version: 2024.8.0

  source_url: https://github.com/hacf-fr/Solar-Router-for-ESPHome/blob/main/blueprints/priority_to_ev.yaml

  input:
    entities:
      name: Entities
      icon: mdi:ev-station
      collapsed: false
      input:
        ev_connected:
          name: EV connected (plug status)
          description: Binary sensor that is ON when the EV is plugged in.
          selector:
            entity:
              domain: binary_sensor
        ev_soc:
          name: EV state of charge (optional)
          description: >-
            Sensor exposing the car's state of charge in %. Leave empty
            if you have no such sensor — the SoC-based cut-off is then
            skipped, and "EV done" is instead detected via the export
            side of the grid (see release_export_threshold).
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: battery
        grid_power:
          name: Grid power (signed, W)
          description: >-
            Signed grid exchange power. Positive = importing from the
            grid, negative = exporting. Point this at the router's Real
            Power sensor (`sensor.*_real_power`).
          selector:
            entity:
              domain: sensor
              device_class: power
        diverted_power:
          name: Diverted power (W)
          description: The Solar Router's Power divertion sensor (`sensor.*_power_divertion`).
          selector:
            entity:
              domain: sensor
              device_class: power
        solar_router:
          name: Solar Router activation switch
          description: The `Activate Solar Routing` switch this automation will toggle.
          selector:
            entity:
              domain: switch

    thresholds:
      name: Thresholds
      icon: mdi:tune
      collapsed: false
      input:
        ev_charging_minimum_surplus:
          name: EV Charging Minimum Surplus (W)
          description: >-
            Minimum surplus needed to hand priority to the EV. The EV
            charger's own minimum is typically 1.4 kW single-phase.
          default: 1400
          selector:
            number:
              min: 0
              max: 20000
              step: 50
              unit_of_measurement: W
              mode: box
        cloud_import_threshold:
          name: Cloud import threshold (W)
          description: >-
            While the router is OFF, importing more than this from the
            grid for `surplus_duration_trigger` seconds is treated as a
            cloud arriving — priority is released to the router.
          default: 200
          selector:
            number:
              min: 0
              max: 5000
              step: 50
              unit_of_measurement: W
              mode: box
        release_export_threshold:
          name: EV-done export threshold (W)
          description: >-
            While the router is OFF, exporting more than this to the
            grid for `surplus_duration_trigger` seconds is treated as
            the EV having stopped drawing (car full, paused, capped) —
            priority is released to the router.
          default: 200
          selector:
            number:
              min: 0
              max: 5000
              step: 50
              unit_of_measurement: W
              mode: box
        surplus_duration_trigger:
          name: Surplus duration trigger (s)
          description: >-
            Debounce window applied to every level-based trigger
            (handoff, cloud, EV-done). Prevents flapping.
          default: 60
          selector:
            number:
              min: 0
              max: 600
              step: 1
              unit_of_measurement: s
              mode: box
        ev_soc_target:
          name: EV state-of-charge target (%)
          description: >-
            Above this SoC, the car is considered "full" and priority is
            released to the router. Ignored if no SoC sensor is set.
            Default 80 % is friendly to battery longevity; set to 100 %
            for a full charge.
          default: 80
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: box

mode: single
max_exceeded: silent

trigger_variables:
  grid_entity: !input grid_power
  diverted_entity: !input diverted_power
  ev_connected_entity: !input ev_connected
  solar_router_entity: !input solar_router
  ev_soc_entity: !input ev_soc
  ev_soc_target_value: !input ev_soc_target
  minimum_surplus_value: !input ev_charging_minimum_surplus
  cloud_import_value: !input cloud_import_threshold
  release_export_value: !input release_export_threshold

variables:
  grid_entity: !input grid_power
  diverted_entity: !input diverted_power
  ev_connected_entity: !input ev_connected
  solar_router_entity: !input solar_router
  ev_soc_entity: !input ev_soc
  ev_soc_target_value: !input ev_soc_target
  minimum_surplus_value: !input ev_charging_minimum_surplus
  cloud_import_value: !input cloud_import_threshold
  release_export_value: !input release_export_threshold

trigger:
  # Handoff — everything needed to hand priority to the EV, stable for N seconds
  - platform: template
    id: handoff
    value_template: >-
      {{ has_value(grid_entity) and has_value(diverted_entity)
         and is_state(ev_connected_entity, 'on')
         and is_state(solar_router_entity, 'on')
         and ( (ev_soc_entity in (none, '', 'none'))
               or (has_value(ev_soc_entity)
                   and (states(ev_soc_entity) | float(0)) < (ev_soc_target_value | float(80))) )
         and ( [0, -(states(grid_entity) | float(0))] | max
             + [0,  (states(diverted_entity) | float(0))] | max )
             > (minimum_surplus_value | float(1400)) }}
    for:
      seconds: !input surplus_duration_trigger

  # Cloud — router is OFF and we are importing more than the threshold
  - platform: template
    id: cloud
    value_template: >-
      {{ has_value(grid_entity)
         and is_state(solar_router_entity, 'off')
         and (states(grid_entity) | float(0)) > (cloud_import_value | float(200)) }}
    for:
      seconds: !input surplus_duration_trigger

  # Release — router is OFF and we are exporting more than the threshold (EV done/paused)
  - platform: template
    id: release
    value_template: >-
      {{ has_value(grid_entity)
         and is_state(solar_router_entity, 'off')
         and -(states(grid_entity) | float(0)) > (release_export_value | float(200)) }}
    for:
      seconds: !input surplus_duration_trigger

  # EV unplugged — restore router immediately
  - platform: state
    entity_id: !input ev_connected
    to: "off"
    id: ev_unplugged

  # SoC target reached — restore router immediately (only fires when an SoC sensor is set)
  - platform: template
    id: soc_target_reached
    value_template: >-
      {% if ev_soc_entity in (none, '', 'none') %}
        false
      {% else %}
        {{ has_value(ev_soc_entity)
           and (states(ev_soc_entity) | float(0)) >= (ev_soc_target_value | float(80)) }}
      {% endif %}

  # Re-evaluate on reload / HA restart — action is a no-op unless a real restore reason holds
  - platform: event
    event_type: automation_reloaded
    id: reload
  - platform: homeassistant
    event: start
    id: ha_start

action:
  - variables:
      sensors_ok: "{{ has_value(grid_entity) and has_value(diverted_entity) }}"
      grid: "{{ (states(grid_entity) | float(0)) if sensors_ok else 0 }}"
      diverted: "{{ (states(diverted_entity) | float(0)) if sensors_ok else 0 }}"
      surplus: "{{ [0, -grid] | max + [0, diverted] | max }}"
      soc_below_target: >-
        {% if ev_soc_entity in (none, '', 'none') %}
          true
        {% else %}
          {{ has_value(ev_soc_entity)
             and (states(ev_soc_entity) | float(0)) < (ev_soc_target_value | float(80)) }}
        {% endif %}
      ev_is_connected: "{{ is_state(ev_connected_entity, 'on') }}"
      router_is_on: "{{ is_state(solar_router_entity, 'on') }}"

  - choose:
      # Branch A — hand priority to the EV
      - conditions:
          - "{{ sensors_ok }}"
          - "{{ ev_is_connected }}"
          - "{{ soc_below_target }}"
          - "{{ surplus > (minimum_surplus_value | float(1400)) }}"
          - "{{ router_is_on }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input solar_router

      # Branch B — restore the router (EV gone / SoC target / cloud / EV done)
      - conditions:
          - "{{ not router_is_on }}"
          - >-
            {{ (not ev_is_connected)
               or (not soc_below_target)
               or ( sensors_ok and grid > (cloud_import_value | float(200)) )
               or ( sensors_ok and (-grid) > (release_export_value | float(200)) ) }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input solar_router
